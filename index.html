<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100E15">
<title>A Fenda</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#100E15}
  iframe{position:fixed;top:0;left:0;width:100%;height:100%;border:none}
</style>
</head>
<body>
<script>
  // ⚠️ COLE AQUI a URL /exec do seu Web App
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwTtQdptwC2e9b9Q-krhKehE2dznXoBuBB8HYCyKf_Ho76v3iey7erX9FJjAbX8Mzt_/exec?page=hub';

  // Só permite essas páginas via shell (evita embutir Hub/Admin por link)
  var PERMITIDAS = ['cofre', 'eventos'];
  var params = new URLSearchParams(location.search);
  var page = params.get('page') || 'cofre';
  if (PERMITIDAS.indexOf(page) === -1) page = 'cofre';

  var src = APPS_SCRIPT_URL + '?page=' + encodeURIComponent(page);
  document.write(
    '<iframe src="' + src.replace(/"/g, '&quot;') +
    '" allow="camera; microphone; clipboard-write" ' +
    'referrerpolicy="no-referrer-when-downgrade"></iframe>'
  );
</script>
</body>
</html>
